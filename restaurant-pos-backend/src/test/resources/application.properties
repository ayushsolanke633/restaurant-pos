spring.application.name=restaurant-pos-backend-test

# Use completely isolated in-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway in unit tests and use Hibernate ddl create-drop on isolated in-memory DB
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-secret-key-do-not-use-in-production-123456789
jwt.expiration-ms=86400000

server.port=-1

# Explicit allowed origins for test context
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
app.seed.demo-users=true
