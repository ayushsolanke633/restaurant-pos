spring.application.name=restaurant-pos-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Demo user seeding disabled by default
app.seed.demo-users=false

server.address=0.0.0.0
server.port=8080

# Login Rate Limiting (P0-3 Stage 2)
app.security.rate-limit.login.enabled=true
app.security.rate-limit.login.max-attempts=5
app.security.rate-limit.login.window-seconds=60
app.security.rate-limit.login.max-entries=10000
app.security.rate-limit.trusted-proxies=


