spring.application.name=restaurant-pos-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_pos}
spring.datasource.username=${DB_USERNAME:restaurant_app}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0.0
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Demo user seeding disabled by default
app.seed.demo-users=false

server.address=0.0.0.0
server.port=8080


