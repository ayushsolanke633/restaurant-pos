# ==============================================================================
# Development Profile Configuration (spring.profiles.active=dev)
# Explicit local development settings. NOT active in production.
# ==============================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_pos}
spring.datasource.username=${DB_USERNAME:restaurant_app}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Demo user seeding enabled only when explicitly opted in for dev
app.seed.demo-users=true
